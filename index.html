<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KODAK FILM CAM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:ital@0;1&display=swap');

  :root {
    --kodak-yellow: #F5C800;
    --film-black: #1a1410;
    --cream: #f0e8d0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--film-black);
    color: var(--cream);
    font-family: 'Space Mono', monospace;
  }

  /* grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
    mix-blend-mode: overlay;
  }

  /* ── LAYOUT: 3行固定 ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }

  /* 上部ヘッダー */
  header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 12px 16px 8px;
    border-bottom: 1px solid #2a2a2a;
  }

  .logo-brand {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--kodak-yellow);
    text-transform: uppercase;
  }
  .logo-model {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--cream);
  }
  .film-counter {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: #666;
    text-align: right;
  }
  .film-counter span {
    display: block;
    font-size: 26px;
    font-weight: 700;
    color: var(--kodak-yellow);
    line-height: 1;
  }

  /* ビューファインダー：残りスペースを全部使う */
  .viewfinder-wrap {
    flex: 1;
    min-height: 0;
    padding: 10px 16px 6px;
    display: flex;
    flex-direction: column;
  }

  .viewfinder {
    flex: 1;
    min-height: 0;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
    border: 1px solid #2a2a2a;
    cursor: pointer;
  }

  /* corner marks */
  .vf-corner {
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: var(--kodak-yellow);
    border-style: solid;
    z-index: 10;
    opacity: 0.5;
  }
  .vf-corner.tl { top:10px; left:10px;  border-width: 1px 0 0 1px; }
  .vf-corner.tr { top:10px; right:10px; border-width: 1px 1px 0 0; }
  .vf-corner.bl { bottom:10px; left:10px;  border-width: 0 0 1px 1px; }
  .vf-corner.br { bottom:10px; right:10px; border-width: 0 1px 1px 0; }

  #video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #canvas-preview {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 40%,
      rgba(10,8,5,0.5) 72%,
      rgba(5,4,2,0.82) 100%
    );
    pointer-events: none;
    z-index: 5;
  }

  .light-leak {
    position: absolute;
    top: -20px; right: -30px;
    width: 180px; height: 110px;
    background: radial-gradient(ellipse,
      rgba(180,220,255,0.11) 0%,
      rgba(100,160,220,0.05) 50%,
      transparent 70%
    );
    pointer-events: none;
    z-index: 6;
    mix-blend-mode: screen;
  }

  .film-data {
    position: absolute;
    bottom: 8px; left: 12px;
    font-size: 8px;
    letter-spacing: 0.12em;
    color: rgba(245,200,0,0.5);
    z-index: 8;
    text-transform: uppercase;
  }
  .film-data-right {
    position: absolute;
    bottom: 8px; right: 12px;
    font-size: 8px;
    letter-spacing: 0.12em;
    color: rgba(245,200,0,0.5);
    z-index: 8;
  }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 4;
  }
  .placeholder-icon {
    width: 50px; height: 50px;
    border: 1.5px solid rgba(245,200,0,0.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .placeholder p {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: #555;
    text-transform: uppercase;
  }

  .flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.05s;
  }
  .flash.active { opacity: 0.7; }

  /* ── 下部コントロール ── */
  .controls {
    flex-shrink: 0;
    padding: 8px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* フィルターストリップ */
  .filter-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .filter-strip::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex-shrink: 0;
    padding: 4px 12px;
    border: 1px solid #333;
    background: transparent;
    color: #777;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active {
    border-color: var(--kodak-yellow);
    color: var(--kodak-yellow);
    background: rgba(245,200,0,0.06);
  }

  /* シャッター行 */
  .shutter-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }

  .side-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: 1px solid #2a2a2a;
    color: #555;
    font-family: 'Space Mono', monospace;
    font-size: 7px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 8px 6px;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
  }
  .side-btn:hover { border-color: #444; color: #888; }
  .side-btn.ready { border-color: var(--kodak-yellow); color: var(--kodak-yellow); }

  .shutter {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid var(--kodak-yellow);
    background: radial-gradient(circle at 40% 38%, #2a2218 0%, #1a1410 100%);
    cursor: pointer;
    position: relative;
    transition: transform 0.1s;
    box-shadow: 0 0 0 4px rgba(245,200,0,0.07), 0 4px 16px rgba(0,0,0,0.6);
    flex-shrink: 0;
  }
  .shutter::after {
    content: '';
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #3a3020 0%, #0a0806 100%);
    border: 1px solid rgba(245,200,0,0.18);
  }
  .shutter:active { transform: scale(0.92); }

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--kodak-yellow);
    color: var(--film-black);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    padding: 7px 18px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 9998;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #file-input { display: none; }
</style>
</head>
<body>

<div class="app">

  <!-- ヘッダー -->
  <header>
    <div>
      <div class="logo-brand">Kodak · Film</div>
      <div class="logo-model">Ultrablue</div>
    </div>
    <div class="film-counter">
      FRAME<br><span id="frame-num">00</span>
    </div>
  </header>

  <!-- ビューファインダー -->
  <div class="viewfinder-wrap">
    <div class="viewfinder" id="viewfinder">
      <div class="vf-corner tl"></div>
      <div class="vf-corner tr"></div>
      <div class="vf-corner bl"></div>
      <div class="vf-corner br"></div>

      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas-preview"></canvas>

      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F5C800" stroke-width="1.2">
            <circle cx="12" cy="12" r="4"/>
            <path d="M3 9a2 2 0 0 1 2-2h1l2-3h8l2 3h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
        </div>
        <p>tap to start camera</p>
      </div>

      <div class="vignette"></div>
      <div class="light-leak"></div>
      <div class="film-data">KODAK ULTRABLUE · 400</div>
      <div class="film-data-right" id="film-date"></div>
      <div class="flash" id="flash"></div>
    </div>
  </div>

  <!-- コントロール -->
  <div class="controls">

    <div class="filter-strip">
      <button class="filter-btn active" onclick="setFilter('ultrablue',this)">Ultrablue</button>
      <button class="filter-btn" onclick="setFilter('portra',this)">Portra</button>
      <button class="filter-btn" onclick="setFilter('ektar',this)">Ektar</button>
      <button class="filter-btn" onclick="setFilter('bw',this)">T-Max</button>
      <button class="filter-btn" onclick="setFilter('fade',this)">Fade</button>
    </div>

    <div class="shutter-row">
      <button class="side-btn" onclick="document.getElementById('file-input').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        LOAD
      </button>

      <button class="shutter" id="shutter-btn" onclick="capture()"></button>

      <button class="side-btn" id="save-btn" onclick="saveImage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        SAVE
      </button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="image/*">
<canvas id="canvas-work" style="display:none"></canvas>

<script>
const video       = document.getElementById('video');
const cvPrev      = document.getElementById('canvas-preview');
const cvWork      = document.getElementById('canvas-work');
const ctxPrev     = cvPrev.getContext('2d');
const ctxWork     = cvWork.getContext('2d');
const flash       = document.getElementById('flash');
const placeholder = document.getElementById('placeholder');
const saveBtn     = document.getElementById('save-btn');
const frameNumEl  = document.getElementById('frame-num');

let currentFilter = 'ultrablue';
let stream        = null;
let frameCount    = 0;
let lastCaptured  = null;
let animFrame     = null;
let uploadedImage = null;

// ── フィルター定義 ──────────────────────────────
function clamp(v){ return Math.max(0,Math.min(255,v|0)); }
function mix(a,b,t){ return a*(1-t)+b*t; }
function sCurve(v,s=1){
  const n=v/255, c=n<.5?2*n*n:-1+(4-2*n)*n;
  return clamp(mix(v,c*255,.35*s));
}
function hardCurve(v){
  const n=v/255;
  return clamp((n<.5?2*n*n:1-Math.pow(-2*n+2,2)/2)*255);
}

const filters = {
  ultrablue(d){
    for(let i=0;i<d.length;i+=4){
      let r=d[i],g=d[i+1],b=d[i+2];
      const lum=0.299*r+0.587*g+0.114*b;
      const sw=Math.max(0,1-lum/120);
      r=clamp(r-sw*18); g=clamp(g-sw*4); b=clamp(b+sw*28);
      r=clamp(r*.97); g=clamp(g*1.01); b=clamp(b*1.06);
      r=sCurve(r); g=sCurve(g); b=sCurve(b);
      d[i]=r;d[i+1]=g;d[i+2]=b;
    }
  },
  portra(d){
    for(let i=0;i<d.length;i+=4){
      let r=d[i],g=d[i+1],b=d[i+2];
      r=clamp(r*1.06+8); g=clamp(g*1.02+4); b=clamp(b*.94);
      const lum=0.299*r+0.587*g+0.114*b;
      const sw=Math.max(0,1-lum/140);
      r=clamp(r+sw*10); g=clamp(g+sw*5);
      r=sCurve(r,1.1); g=sCurve(g,1.05); b=sCurve(b,.95);
      d[i]=r;d[i+1]=g;d[i+2]=b;
    }
  },
  ektar(d){
    for(let i=0;i<d.length;i+=4){
      let r=d[i],g=d[i+1],b=d[i+2];
      r=clamp(r*1.12); g=clamp(g*1.05); b=clamp(b*.88);
      r=hardCurve(r); g=hardCurve(g); b=hardCurve(b);
      d[i]=r;d[i+1]=g;d[i+2]=b;
    }
  },
  bw(d){
    for(let i=0;i<d.length;i+=4){
      const c=hardCurve(clamp(0.21*d[i]+0.72*d[i+1]+0.07*d[i+2]));
      d[i]=c;d[i+1]=c;d[i+2]=c;
    }
  },
  fade(d){
    for(let i=0;i<d.length;i+=4){
      let r=d[i],g=d[i+1],b=d[i+2];
      r=clamp(r*.85+28); g=clamp(g*.85+22); b=clamp(b*.90+30);
      const lum=0.299*r+0.587*g+0.114*b;
      b=clamp(b+Math.max(0,1-lum/100)*20);
      d[i]=r;d[i+1]=g;d[i+2]=b;
    }
  }
};

function addGrain(ctx,w,h){
  const id=ctx.getImageData(0,0,w,h), d=id.data;
  for(let i=0;i<d.length;i+=4){
    const lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const n=(Math.random()-.5)*18*(1+Math.max(0,1-lum/180)*.8);
    d[i]=clamp(d[i]+n); d[i+1]=clamp(d[i+1]+n*.9); d[i+2]=clamp(d[i+2]+n*.85);
  }
  ctx.putImageData(id,0,0);
}

function addVignette(ctx,w,h){
  const g=ctx.createRadialGradient(w/2,h/2,h*.22,w/2,h/2,h*.7);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(.7,'rgba(5,4,2,0.28)');
  g.addColorStop(1,'rgba(5,4,2,0.72)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
}

function addLeak(ctx,w,h){
  const g=ctx.createRadialGradient(w*.85,-h*.05,0,w*.85,-h*.05,w*.5);
  g.addColorStop(0,'rgba(180,225,255,0.09)');
  g.addColorStop(.5,'rgba(140,190,240,0.04)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
}

function applyFilter(ctx,w,h){
  const id=ctx.getImageData(0,0,w,h);
  filters[currentFilter](id.data);
  ctx.putImageData(id,0,0);
  addLeak(ctx,w,h);
  addVignette(ctx,w,h);
  addGrain(ctx,w,h);
}

// ── ビューファインダーのサイズをDOM基準で設定 ──
function syncCanvasSize(){
  const vf = document.getElementById('viewfinder');
  const W = vf.clientWidth;
  const H = vf.clientHeight;
  cvWork.width  = W; cvWork.height  = H;
  cvPrev.width  = W; cvPrev.height  = H;
}

// ── プレビューループ ──────────────────────────
function startLoop(){
  if(animFrame) cancelAnimationFrame(animFrame);
  function loop(){
    const src = uploadedImage || (stream ? video : null);
    if(!src){ animFrame=requestAnimationFrame(loop); return; }
    const W=cvWork.width, H=cvWork.height;
    // object-fit: cover 相当の描画
    const sw=src.videoWidth||src.naturalWidth||src.width;
    const sh=src.videoHeight||src.naturalHeight||src.height;
    if(!sw||!sh){ animFrame=requestAnimationFrame(loop); return; }
    const scale=Math.max(W/sw, H/sh);
    const dw=sw*scale, dh=sh*scale;
    const ox=(W-dw)/2, oy=(H-dh)/2;
    ctxWork.drawImage(src, ox, oy, dw, dh);
    applyFilter(ctxWork,W,H);
    ctxPrev.drawImage(cvWork,0,0);
    animFrame=requestAnimationFrame(loop);
  }
  loop();
}

// ── カメラ起動 ────────────────────────────────
async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment' }, audio:false
    });
    video.srcObject=stream;
    await video.play();
    syncCanvasSize();
    uploadedImage=null;
    video.style.display='block';
    cvPrev.style.display='block';
    placeholder.style.display='none';
    startLoop();
  }catch(e){
    showToast('カメラへのアクセスが拒否されました');
  }
}

// ── 画像アップロード ──────────────────────────
document.getElementById('file-input').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const img=new Image();
  img.onload=()=>{
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    uploadedImage=img;
    syncCanvasSize();
    video.style.display='none';
    cvPrev.style.display='block';
    placeholder.style.display='none';
    startLoop();
  };
  img.src=URL.createObjectURL(file);
  e.target.value='';
});

// ── シャッター ────────────────────────────────
function capture(){
  if(!stream && !uploadedImage){ startCamera(); return; }
  flash.classList.add('active');
  setTimeout(()=>flash.classList.remove('active'),120);

  const W=cvWork.width, H=cvWork.height;
  const fc=document.createElement('canvas');
  fc.width=W; fc.height=H;
  const fCtx=fc.getContext('2d');
  const src=uploadedImage||(stream?video:null);
  if(!src) return;
  const sw=src.videoWidth||src.naturalWidth||src.width;
  const sh=src.videoHeight||src.naturalHeight||src.height;
  const scale=Math.max(W/sw,H/sh);
  const dw=sw*scale, dh=sh*scale;
  fCtx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
  applyFilter(fCtx,W,H);

  // 日付スタンプ
  const now=new Date();
  const ds=`${String(now.getFullYear()).slice(2)}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  fCtx.font=`bold ${Math.round(H*0.022)}px "Space Mono",monospace`;
  fCtx.fillStyle='rgba(245,200,0,0.88)';
  fCtx.textAlign='right';
  fCtx.fillText(ds, W-12, H-10);

  lastCaptured=fc.toDataURL('image/jpeg',0.92);
  frameCount++;
  frameNumEl.textContent=String(frameCount).padStart(2,'0');
  saveBtn.classList.add('ready');
  showToast('FRAME '+String(frameCount).padStart(2,'0')+' · EXPOSED');
}

// ── 保存 ──────────────────────────────────────
function saveImage(){
  if(!lastCaptured){ showToast('先にシャッターを押してください'); return; }
  const a=document.createElement('a');
  a.href=lastCaptured;
  a.download=`kodak_ultrablue_${Date.now()}.jpg`;
  a.click();
  showToast('SAVED');
}

// ── フィルター切替 ────────────────────────────
function setFilter(f, btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ── 日付表示 ──────────────────────────────────
const now=new Date();
document.getElementById('film-date').textContent=
  `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}`;

// ── Toast ─────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── タップでカメラ起動 ────────────────────────
document.getElementById('viewfinder').addEventListener('click',()=>{
  if(!stream && !uploadedImage) startCamera();
});

// リサイズ対応
window.addEventListener('resize', ()=>{
  if(stream||uploadedImage) syncCanvasSize();
});
</script>
</body>
</html>
