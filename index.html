<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KODAK FILM CAM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:ital@0;1&display=swap');

  :root {
    --kodak-yellow: #F5C800;
    --film-black: #1a1410;
    --grain-brown: #2d2318;
    --shadow-blue: #1a2a3a;
    --cream: #f0e8d0;
    --cyan-tint: #b8d4e8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--film-black);
    color: var(--cream);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
    mix-blend-mode: overlay;
  }

  header {
    width: 100%;
    max-width: 480px;
    padding: 20px 24px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid #333;
  }

  .logo {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .logo-brand {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--kodak-yellow);
    text-transform: uppercase;
  }

  .logo-model {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--cream);
    letter-spacing: 0.05em;
  }

  .film-counter {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #666;
    text-align: right;
  }

  .film-counter span {
    display: block;
    font-size: 28px;
    font-weight: 700;
    color: var(--kodak-yellow);
    line-height: 1;
  }

  /* ── VIEWFINDER ── */
  .viewfinder-wrap {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    position: relative;
  }

  .viewfinder {
    width: 100%;
    aspect-ratio: 3/4;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid #2a2a2a;
  }

  /* corner marks */
  .viewfinder::before,
  .viewfinder::after {
    content: '';
    position: absolute;
    width: 24px;
    height: 24px;
    border-color: var(--kodak-yellow);
    border-style: solid;
    z-index: 10;
    opacity: 0.6;
  }
  .viewfinder::before { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
  .viewfinder::after  { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

  /* additional corners via pseudo on inner */
  .vf-corner-tr, .vf-corner-bl {
    position: absolute;
    width: 24px;
    height: 24px;
    border-color: var(--kodak-yellow);
    border-style: solid;
    z-index: 10;
    opacity: 0.6;
  }
  .vf-corner-tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
  .vf-corner-bl { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; }

  #video, #canvas-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #canvas-preview { display: none; }

  /* vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 40%,
      rgba(10,8,5,0.55) 75%,
      rgba(5,4,2,0.85) 100%
    );
    pointer-events: none;
    z-index: 5;
  }

  /* light leak top */
  .light-leak {
    position: absolute;
    top: -20px;
    right: -30px;
    width: 200px;
    height: 120px;
    background: radial-gradient(ellipse,
      rgba(180,220,255,0.12) 0%,
      rgba(100,160,220,0.06) 50%,
      transparent 70%
    );
    pointer-events: none;
    z-index: 6;
    mix-blend-mode: screen;
  }

  /* film data overlay */
  .film-data {
    position: absolute;
    bottom: 10px;
    left: 14px;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: rgba(245,200,0,0.55);
    z-index: 8;
    text-transform: uppercase;
  }

  .film-data-right {
    position: absolute;
    bottom: 10px;
    right: 14px;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: rgba(245,200,0,0.55);
    z-index: 8;
    text-transform: uppercase;
  }

  /* placeholder */
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 4;
  }

  .placeholder-icon {
    width: 56px;
    height: 56px;
    border: 1.5px solid rgba(245,200,0,0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .placeholder-icon svg {
    opacity: 0.35;
  }

  .placeholder p {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #555;
    text-transform: uppercase;
  }

  /* shutter flash */
  .flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.05s;
  }
  .flash.active { opacity: 0.7; }

  /* ── CONTROLS ── */
  .controls {
    width: 100%;
    max-width: 480px;
    padding: 0 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* filter strip */
  .filter-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filter-strip::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex-shrink: 0;
    padding: 5px 14px;
    border: 1px solid #333;
    background: transparent;
    color: #888;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn.active {
    border-color: var(--kodak-yellow);
    color: var(--kodak-yellow);
    background: rgba(245,200,0,0.06);
  }

  /* bottom row */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }

  .upload-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: 1px solid #333;
    color: #666;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .upload-btn:hover { border-color: #555; color: #999; }

  .shutter {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid var(--kodak-yellow);
    background: radial-gradient(circle at 40% 38%,
      #2a2218 0%, #1a1410 100%
    );
    cursor: pointer;
    position: relative;
    transition: transform 0.1s;
    box-shadow: 0 0 0 4px rgba(245,200,0,0.08), 0 4px 20px rgba(0,0,0,0.6);
  }
  .shutter::after {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%,
      #3a3020 0%, #0a0806 100%
    );
    border: 1px solid rgba(245,200,0,0.2);
  }
  .shutter:active { transform: scale(0.93); }

  .save-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: 1px solid #333;
    color: #666;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .save-btn:hover { border-color: #555; color: #999; }
  .save-btn.ready { border-color: var(--kodak-yellow); color: var(--kodak-yellow); }

  /* ── GALLERY ── */
  .gallery-section {
    width: 100%;
    max-width: 480px;
    padding: 0 16px 40px;
  }

  .gallery-label {
    font-size: 9px;
    letter-spacing: 0.25em;
    color: #444;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-top: 8px;
    border-top: 1px solid #222;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .gallery-item {
    aspect-ratio: 3/4;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
  }
  .gallery-item:hover img { transform: scale(1.04); }

  #file-input { display: none; }

  /* camera mode indicator */
  .mode-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 8px 0 4px;
  }
  .mode-item {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: #444;
    text-transform: uppercase;
    cursor: pointer;
    padding: 2px 0;
    border-bottom: 1px solid transparent;
    transition: all 0.2s;
  }
  .mode-item.active {
    color: var(--cream);
    border-bottom-color: var(--kodak-yellow);
  }

  /* notification */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--kodak-yellow);
    color: var(--film-black);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    padding: 8px 20px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 9998;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-brand">Kodak · Film</div>
    <div class="logo-model">Ultrablue</div>
  </div>
  <div class="film-counter">
    FRAME<br>
    <span id="frame-num">00</span>
  </div>
</header>

<div class="mode-bar">
  <div class="mode-item active" data-mode="camera" onclick="setMode('camera')">Camera</div>
  <div class="mode-item" data-mode="upload" onclick="setMode('upload')">Upload</div>
</div>

<div class="viewfinder-wrap">
  <div class="viewfinder" id="viewfinder">
    <div class="vf-corner-tr"></div>
    <div class="vf-corner-bl"></div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas-preview"></canvas>

    <div class="placeholder" id="placeholder">
      <div class="placeholder-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F5C800" stroke-width="1.2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M3 9a2 2 0 0 1 2-2h1l2-3h8l2 3h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
      </div>
      <p>tap to start camera</p>
    </div>

    <div class="vignette"></div>
    <div class="light-leak"></div>
    <div class="film-data" id="film-data-left">KODAK ULTRABLUE · 400</div>
    <div class="film-data-right" id="film-data-right" style="display:none"></div>
    <div class="flash" id="flash"></div>
  </div>
</div>

<div class="controls">
  <div class="filter-strip">
    <button class="filter-btn active" onclick="setFilter('ultrablue')">Ultrablue</button>
    <button class="filter-btn" onclick="setFilter('portra')">Portra</button>
    <button class="filter-btn" onclick="setFilter('ektar')">Ektar</button>
    <button class="filter-btn" onclick="setFilter('bw')">T-Max</button>
    <button class="filter-btn" onclick="setFilter('fade')">Fade</button>
  </div>

  <div class="bottom-row">
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      LOAD
    </button>
    <button class="shutter" id="shutter-btn" onclick="capture()"></button>
    <button class="save-btn" id="save-btn" onclick="saveImage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      SAVE
    </button>
  </div>
</div>

<div class="gallery-section">
  <div class="gallery-label">Roll · <span id="roll-count">0</span> frames</div>
  <div class="gallery" id="gallery"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="image/*">

<!-- hidden canvas for processing -->
<canvas id="canvas-work" style="display:none"></canvas>

<script>
const video = document.getElementById('video');
const canvasPreview = document.getElementById('canvas-preview');
const canvasWork = document.getElementById('canvas-work');
const ctxPreview = canvasPreview.getContext('2d');
const ctxWork = canvasWork.getContext('2d');
const flash = document.getElementById('flash');
const placeholder = document.getElementById('placeholder');
const gallery = document.getElementById('gallery');
const saveBtn = document.getElementById('save-btn');
const frameNumEl = document.getElementById('frame-num');
const rollCount = document.getElementById('roll-count');
const filmDataRight = document.getElementById('film-data-right');

let currentFilter = 'ultrablue';
let stream = null;
let frameCount = 0;
let lastCaptured = null;
let mode = 'camera';
let animFrame = null;
let uploadedImage = null;

// ── FILTER DEFINITIONS ──────────────────────────────
const filters = {
  ultrablue: (d) => {
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i+1], b = d[i+2];
      // shadow luminance
      const lum = 0.299*r + 0.587*g + 0.114*b;
      const shadowWeight = Math.max(0, 1 - lum/120);
      // shift shadows blue/cyan
      r = clamp(r - shadowWeight * 18);
      g = clamp(g - shadowWeight * 8  + shadowWeight * 4);
      b = clamp(b + shadowWeight * 28);
      // global slight cyan cast
      r = clamp(r * 0.97);
      g = clamp(g * 1.01);
      b = clamp(b * 1.06);
      // gentle S-curve contrast
      r = sCurve(r);
      g = sCurve(g);
      b = sCurve(b);
      // slight desaturate highlights
      const newLum = 0.299*r + 0.587*g + 0.114*b;
      const hiWeight = Math.max(0, (lum - 180)/75);
      r = clamp(mix(r, newLum, hiWeight * 0.3));
      g = clamp(mix(g, newLum, hiWeight * 0.3));
      b = clamp(mix(b, newLum, hiWeight * 0.3));
      d[i]=r; d[i+1]=g; d[i+2]=b;
    }
  },
  portra: (d) => {
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i+1], b = d[i+2];
      r = clamp(r * 1.06 + 8);
      g = clamp(g * 1.02 + 4);
      b = clamp(b * 0.94);
      const lum = 0.299*r + 0.587*g + 0.114*b;
      const sw = Math.max(0, 1 - lum/140);
      r = clamp(r + sw*10);
      g = clamp(g + sw*5);
      r = sCurve(r, 1.1); g = sCurve(g, 1.05); b = sCurve(b, 0.95);
      d[i]=r; d[i+1]=g; d[i+2]=b;
    }
  },
  ektar: (d) => {
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i+1], b = d[i+2];
      r = clamp(r * 1.12);
      g = clamp(g * 1.05);
      b = clamp(b * 0.88);
      r = hardCurve(r); g = hardCurve(g); b = hardCurve(b);
      d[i]=r; d[i+1]=g; d[i+2]=b;
    }
  },
  bw: (d) => {
    for (let i = 0; i < d.length; i += 4) {
      const lum = clamp(0.21*d[i] + 0.72*d[i+1] + 0.07*d[i+2]);
      const c = hardCurve(lum);
      d[i]=c; d[i+1]=c; d[i+2]=c;
    }
  },
  fade: (d) => {
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i+1], b = d[i+2];
      r = clamp(r*0.85 + 28);
      g = clamp(g*0.85 + 22);
      b = clamp(b*0.90 + 30);
      const lum = 0.299*r + 0.587*g + 0.114*b;
      const sw = Math.max(0, 1 - lum/100);
      b = clamp(b + sw * 20);
      d[i]=r; d[i+1]=g; d[i+2]=b;
    }
  }
};

function clamp(v) { return Math.max(0, Math.min(255, v|0)); }
function mix(a,b,t) { return a*(1-t)+b*t; }
function sCurve(v, strength=1.0) {
  const n = v/255;
  const s = n < 0.5
    ? 2*n*n
    : -1+( 4-2*n)*n;
  return clamp(mix(v, s*255, 0.35*strength));
}
function hardCurve(v) {
  const n = v/255;
  return clamp((n < 0.5 ? 2*n*n : 1-Math.pow(-2*n+2,2)/2) * 255);
}

// grain
function addGrain(ctx, w, h, amount=18) {
  const imgData = ctx.getImageData(0,0,w,h);
  const d = imgData.data;
  for (let i=0; i<d.length; i+=4) {
    const noise = (Math.random()-0.5)*amount;
    const lum = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    // more grain in shadows
    const grainAmount = noise * (1 + Math.max(0, 1-lum/180)*0.8);
    d[i]   = clamp(d[i]   + grainAmount);
    d[i+1] = clamp(d[i+1] + grainAmount * 0.9);
    d[i+2] = clamp(d[i+2] + grainAmount * 0.85);
  }
  ctx.putImageData(imgData, 0, 0);
}

// vignette on canvas
function addCanvasVignette(ctx, w, h) {
  const grad = ctx.createRadialGradient(w/2, h/2, h*0.25, w/2, h/2, h*0.72);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.7, 'rgba(5,4,2,0.3)');
  grad.addColorStop(1, 'rgba(5,4,2,0.75)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

// light leak
function addLightLeak(ctx, w, h) {
  const grad = ctx.createRadialGradient(w*0.85, -h*0.05, 0, w*0.85, -h*0.05, w*0.55);
  grad.addColorStop(0, 'rgba(180,225,255,0.10)');
  grad.addColorStop(0.5,'rgba(140,190,240,0.05)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

// process image with filter
function applyFilter(ctx, w, h) {
  const imgData = ctx.getImageData(0,0,w,h);
  const fn = filters[currentFilter];
  if (fn) fn(imgData.data);
  ctx.putImageData(imgData,0,0);
  addLightLeak(ctx,w,h);
  addCanvasVignette(ctx,w,h);
  addGrain(ctx,w,h,16);
}

// ── LIVE PREVIEW LOOP ──────────────────────────────
function startPreviewLoop() {
  if (animFrame) cancelAnimationFrame(animFrame);
  function loop() {
    if (!stream && !uploadedImage) { animFrame = requestAnimationFrame(loop); return; }
    const src = uploadedImage || video;
    const W = canvasWork.width, H = canvasWork.height;
    ctxWork.drawImage(src, 0, 0, W, H);
    applyFilter(ctxWork, W, H);
    ctxPreview.drawImage(canvasWork, 0, 0, canvasPreview.width, canvasPreview.height);
    animFrame = requestAnimationFrame(loop);
  }
  loop();
}

// ── CAMERA ────────────────────────────────────────
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: {ideal:1080}, height:{ideal:1440} },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    canvasWork.width = 540; canvasWork.height = 720;
    canvasPreview.width = canvasWork.width;
    canvasPreview.height = canvasWork.height;

    video.style.display = 'none';
    canvasPreview.style.display = 'block';
    placeholder.style.display = 'none';
    uploadedImage = null;
    startPreviewLoop();
  } catch(e) {
    showToast('カメラへのアクセスが拒否されました');
  }
}

// ── UPLOAD ────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const aspect = img.naturalHeight / img.naturalWidth;
    const W = 540, H = Math.round(W * aspect);
    canvasWork.width = W; canvasWork.height = H;
    canvasPreview.width = W; canvasPreview.height = H;

    if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
    uploadedImage = img;
    video.style.display = 'none';
    canvasPreview.style.display = 'block';
    placeholder.style.display = 'none';
    startPreviewLoop();
  };
  img.src = URL.createObjectURL(file);
  e.target.value = '';
});

// ── CAPTURE ───────────────────────────────────────
function capture() {
  if (!stream && !uploadedImage) { startCamera(); return; }

  // flash
  flash.classList.add('active');
  setTimeout(()=>flash.classList.remove('active'), 120);

  // render final frame
  const W = canvasWork.width, H = canvasWork.height;
  const final = document.createElement('canvas');
  final.width = W; final.height = H;
  const fCtx = final.getContext('2d');
  fCtx.drawImage(uploadedImage || video, 0, 0, W, H);
  applyFilter(fCtx, W, H);

  // date stamp
  const now = new Date();
  const dateStr = `${now.getFullYear().toString().slice(2)}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  fCtx.font = '500 13px "Space Mono", monospace';
  fCtx.fillStyle = 'rgba(245,200,0,0.85)';
  fCtx.textAlign = 'right';
  fCtx.fillText(dateStr, W-14, H-12);

  lastCaptured = final.toDataURL('image/jpeg', 0.92);

  // update counter
  frameCount++;
  frameNumEl.textContent = String(frameCount).padStart(2,'0');

  // add to gallery
  const item = document.createElement('div');
  item.className = 'gallery-item';
  const thumb = document.createElement('img');
  thumb.src = lastCaptured;
  item.appendChild(thumb);
  item.onclick = () => {
    lastCaptured = thumb.src;
    saveBtn.classList.add('ready');
  };
  gallery.prepend(item);
  rollCount.textContent = frameCount;

  saveBtn.classList.add('ready');
  showToast('FRAME ' + String(frameCount).padStart(2,'0') + ' · EXPOSED');
}

// ── SAVE ──────────────────────────────────────────
function saveImage() {
  if (!lastCaptured) { showToast('先にシャッターを押してください'); return; }
  const a = document.createElement('a');
  a.href = lastCaptured;
  a.download = `kodak_ultrablue_${Date.now()}.jpg`;
  a.click();
  showToast('SAVED TO ROLL');
}

// ── FILTER SWITCH ─────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}

// ── MODE ──────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.mode===m);
  });
  if (m==='camera') {
    if (!stream) startCamera();
  } else {
    document.getElementById('file-input').click();
  }
}

// ── TOAST ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ── INIT ──────────────────────────────────────────
document.getElementById('viewfinder').addEventListener('click', () => {
  if (!stream && !uploadedImage) startCamera();
});

// date in film data
const now = new Date();
document.getElementById('film-data-right').style.display = 'block';
document.getElementById('film-data-right').textContent =
  `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}`;
</script>
</body>
